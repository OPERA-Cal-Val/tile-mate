name: Test

on:
  workflow_dispatch:
    branches:
      - dev
      - main
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["py311", "py312", "py313", "py314"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}

      - name: Pytest
        run: pixi run -e ${{ matrix.environment }} pytest tests
