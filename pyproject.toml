[build-system]
requires = ['setuptools>=60', 'setuptools-scm>=8.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'tile-mate'
requires-python = '>=3.11'
authors = [
    { name = 'Alexander Handwerger, Charlie Marshak, and OPERA Project Science Team' },
]
description = 'Create rasters from global tiles'
license = { text = 'Apache-2.0' }
classifiers = [
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

dynamic = ['version', 'readme']

dependencies = [
    "boto3",
    "rasterio",
    "tqdm",
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "pandera",
    "shapely",
    "dem-stitcher>=2.5.4",
]

[project.optional-dependencies]
develop = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/OPERA-Cal-Val/tile-mate"
"Bug Tracker" = "https://github.com/OPERA-Cal-Val/tile-mate/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["notebooks*", "tests*"]

[tool.setuptools.dynamic]
readme = { file = ['README.md'], content-type = 'text/markdown' }

[tool.setuptools_scm]

[tool.ruff]
line-length = 120

# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "notebooks/"
]
indent-width = 4

[tool.ruff.format]
quote-style = "single"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
tile-mate = { path = ".", editable = true }

[tool.pixi.dependencies]
rasterio = ">=1.4,<2"
shapely = ">=2.0,<3"
numpy = ">=1.26,<3"
matplotlib = ">=3.8,<4"
fiona = ">=1.9,<2"
geopandas = ">=1.0,<2"
gdal = ">=3.8,<4"
boto3 = ">=1.34,<2"
tqdm = ">=4.66,<5"
dem_stitcher = ">=2.5.4"
pandas = ">=2.2,<4"
pandera = ">=0.20,<0.33"
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.16.3,<0.17"
ipykernel = ">=6.29,<8"
jupyterlab = ">=4.2,<5"
jupyter-collaboration = ">=3,<6"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# `default` is the newest supported python and the only environment installed
# locally; the pyXYZ environments exist for the CI matrix and are built on demand.
[tool.pixi.environments]
default = { features = ["py314"], solve-group = "py314" }
py311 = { features = ["py311"], solve-group = "py311" }
py312 = { features = ["py312"], solve-group = "py312" }
py313 = { features = ["py313"], solve-group = "py313" }
py314 = { features = ["py314"], solve-group = "py314" }

[tool.pixi.tasks]
lint = "ruff check src tests"
format = "ruff format src tests"
fix = "ruff check --fix src tests"
test = "pytest tests"
